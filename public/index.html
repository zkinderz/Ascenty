<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="page_title"></title>

  <!-- Fonte Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Favicon -->
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="logo">
    <img src="assets/images/logo-ascenty.png" alt="Logo Ascenty">
  </div>
  <nav>
    <a href="#empresa" data-i18n="navbar_empresa"></a>
    <a href="#tecnologia" data-i18n="navbar_tecnologia"></a>
    <a href="#seguranca" data-i18n="navbar_seguranca"></a>
    <a href="#equipe" data-i18n="navbar_equipe"></a>
    <a href="#politicas" data-i18n="navbar_politicas"></a>
    <a href="#quiz" data-i18n="navbar_quiz"></a>
  </nav>

  <!-- Seletor de idioma -->
  <div class="lang-switcher">
    <select id="langSwitcher">
      <option value="pt">🇧🇷 PT</option>
      <option value="en">🇺🇸 EN</option>
      <option value="es">🇲🇽 ES</option>
    </select>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <img src="assets/images/datacenter.png" alt="Datacenter Ascenty" class="hero-image">
    <h1 data-i18n="hero_title"></h1>
    <p data-i18n="hero_subtitle"></p>
    <a href="#empresa" class="btn" data-i18n="hero_button"></a>
  </div>
</section>


  <!-- EMPRESA -->
<section id="empresa" class="section">
  <h2 data-i18n="empresa_title"></h2>
  <div class="cards">
    <a href="https://ascenty1.sharepoint.com/sites/Ascenty2/SitePages/Nossa-Historia.aspx" class="card" target="_blank">
      <h3>🏢 <span data-i18n="empresa_historia_title"></span></h3>
      <p data-i18n="empresa_historia_text"></p>
    </a>
    <a href="https://ascenty1.sharepoint.com/sites/Ascenty2/SitePages/Proposito-e-Missao.aspx" class="card" target="_blank">
      <h3>🎯 <span data-i18n="empresa_proposito_title"></span></h3>
      <p data-i18n="empresa_proposito_text"></p>
    </a>
    <a href="https://ascenty1.sharepoint.com/sites/Ascenty2/SitePages/Nossos-Valores.aspx" class="card" target="_blank">
      <h3>💙 <span data-i18n="empresa_valores_title"></span></h3>
      <p data-i18n="empresa_valores_text"></p>
    </a>
  </div>
</section>

<!-- NÚMEROS -->
<section class="numbers">
  <h2 data-i18n="numeros_title"></h2>
  <div class="numbers-grid">
    <div>
      <span class="counter" data-target="28">0</span>
      <p data-i18n="numeros_datacenters"></p>
    </div>
    <div>
      <span class="counter" data-target="1100">0</span>
      <p data-i18n="numeros_colaboradores"></p>
    </div>
    <div>
      <span class="counter" data-target="750">0</span>
      <p data-i18n="numeros_clientes"></p>
    </div>
  </div>
</section>

<!-- TECNOLOGIAS -->
<section id="tecnologia" class="section">
  <h2 data-i18n="tecnologia_title"></h2>
  <div class="cards">
    <div class="card" onclick="openModal('azure')">
      <h3>☁️ <span data-i18n="tecnologia_azure_title"></span></h3>
    </div>
    <div class="card" onclick="openModal('vmware')">
      <h3>🖥️ <span data-i18n="tecnologia_vmware_title"></span></h3>
    </div>
    <div class="card" onclick="openModal('firewall')">
      <h3>🛡️ <span data-i18n="tecnologia_firewall_title"></span></h3>
    </div>
    <div class="card" onclick="openModal('servicenow')">
      <h3>🎫 <span data-i18n="tecnologia_servicenow_title"></span></h3>
    </div>
  </div>
</section>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <button class="close" onclick="closeModal()" aria-label="Fechar modal">&times;</button>
    <div id="modal-text" class="modal-body"></div>
  </div>
</div>


<!-- SEGURANÇA -->
<section id="seguranca" class="section dark">
  <h2 data-i18n="seguranca_title"></h2>
  <div class="cards">

    <!-- MFA -->
<div class="card" onclick="toggleExpand('mfa')">
  <h3>🔐 <span data-i18n="mfa_title"></span></h3>
  <p data-i18n="mfa_desc"></p>
</div>
<div id="mfa" class="expand">
  <h4 data-i18n="mfa_what"></h4>
  <p data-i18n="mfa_what_text"></p>
  <h4 data-i18n="mfa_why"></h4>
  <ul>
    <li data-i18n="mfa_point1"></li>
    <li data-i18n="mfa_point2"></li>
    <li data-i18n="mfa_point3"></li>
  </ul>
  <p><strong data-i18n="impact_label"></strong> <span data-i18n="mfa_impact"></span></p>
</div>

<!-- Ferramentas de Segurança -->
<div class="card" onclick="toggleExpand('ferramentas')">
  <h3>🛡️ <span data-i18n="ferramentas_title"></span></h3>
  <p data-i18n="ferramentas_desc"></p>
</div>
<div id="ferramentas" class="expand">
  <h4 data-i18n="ferramentas_what"></h4>
  <p data-i18n="ferramentas_what_text"></p>
  <h4 data-i18n="ferramentas_why"></h4>
  <ul>
    <li><strong>SentinelOne:</strong> <span data-i18n="ferramentas_point1"></span></li>
    <li><strong>Rapid7:</strong> <span data-i18n="ferramentas_point2"></span></li>
    <li><strong>NinjaOne:</strong> <span data-i18n="ferramentas_point3"></span></li>
    <li><strong>Zscaler:</strong> <span data-i18n="ferramentas_point4"></span></li>
  </ul>
  <p><strong data-i18n="impact_label"></strong> <span data-i18n="ferramentas_impact"></span></p>
</div>

<!-- BitLocker -->
<div class="card" onclick="toggleExpand('bitlocker')">
  <h3>💻 <span data-i18n="bitlocker_title"></span></h3>
  <p data-i18n="bitlocker_desc"></p>
</div>
<div id="bitlocker" class="expand">
  <h4 data-i18n="bitlocker_what"></h4>
  <p data-i18n="bitlocker_what_text"></p>
  <h4 data-i18n="bitlocker_why"></h4>
  <ul>
    <li data-i18n="bitlocker_point1"></li>
    <li data-i18n="bitlocker_point2"></li>
    <li data-i18n="bitlocker_point3"></li>
  </ul>
  <p><strong data-i18n="impact_label"></strong> <span data-i18n="bitlocker_impact"></span></p>
</div>

</div>
</section>

<!-- KnowBe4 Treinamentos -->
<div class="knowbe4-container">
  <div class="card knowbe4" onclick="toggleExpand('knowbe4')">
    <h3>🎓 <span data-i18n="knowbe4_title"></span></h3>
    <p data-i18n="knowbe4_desc"></p>
  </div>
  <div id="knowbe4" class="expand">
    <h4 data-i18n="knowbe4_what"></h4>
    <p data-i18n="knowbe4_what_text"></p>
    <h4 data-i18n="knowbe4_why"></h4>
    <ul>
      <li data-i18n="knowbe4_point1"></li>
      <li data-i18n="knowbe4_point2"></li>
      <li data-i18n="knowbe4_point3"></li>
      <li data-i18n="knowbe4_point4"></li>
    </ul>
    <p><strong data-i18n="impact_label"></strong> <span data-i18n="knowbe4_impact"></span></p>
    <div class="knowbe4-button">
      <a href="https://training.knowbe4.com/app/login" target="_blank" rel="noopener noreferrer" data-i18n="knowbe4_button"></a>
    </div>
  </div>
</div>

  <!-- EQUIPE -->
<section id="equipe" class="section">
  <h2 data-i18n="equipe_suporte_title"></h2>
  <div class="cards">
    <div class="card"><h3 data-i18n="equipe_renato_nome"></h3><p data-i18n="equipe_renato_funcao"></p></div>
    <div class="card"><h3 data-i18n="equipe_gabriel_nome"></h3><p data-i18n="equipe_gabriel_funcao"></p></div>
    <div class="card"><h3 data-i18n="equipe_eric_nome"></h3><p data-i18n="equipe_eric_funcao"></p></div>
    <div class="card"><h3 data-i18n="equipe_rafael_nome"></h3><p data-i18n="equipe_rafael_funcao"></p></div>
  </div>
</section>

<section id="infra" class="section">
  <h2 data-i18n="equipe_infra_title"></h2>
  <div class="cards">
    <div class="card"><h3 data-i18n="infra_rui_nome"></h3><p data-i18n="infra_rui_funcao"></p></div>
    <div class="card"><h3 data-i18n="infra_diego_nome"></h3><p data-i18n="infra_diego_funcao"></p></div>
    <div class="card"><h3 data-i18n="infra_gustavo_nome"></h3><p data-i18n="infra_gustavo_funcao"></p></div>
    <div class="card"><h3 data-i18n="infra_daniel_nome"></h3><p data-i18n="infra_daniel_funcao"></p></div>
  </div>
</section>

<!-- POLÍTICAS DE TI -->
<section id="politicas" class="section dark">
  <h2 data-i18n="politicas_title"></h2>

  <div class="cards destaque">
    <a href="https://ascenty1.sharepoint.com/sites/Ascenty2/SitePages/Tecnologia_da_Informacao.aspx" 
       class="card" target="_blank" rel="noopener noreferrer">
      <h3>📑 <span data-i18n="politicas_portal_title"></span></h3>
      <p data-i18n="politicas_portal_text"></p>
    </a>
  </div>

  <div class="cards politicas-grid">
    <!-- Uso de Notebooks -->
    <div class="card" onclick="toggleExpand('politica-notebook')">
      <h3>💻 <span data-i18n="politica_notebook_title"></span></h3>
      <p data-i18n="politica_notebook_desc"></p>
    </div>
    <div id="politica-notebook" class="expand">
      <h4 data-i18n="politica_notebook_what"></h4>
      <p data-i18n="politica_notebook_what_text"></p>
      <h4 data-i18n="politica_notebook_why"></h4>
      <ul>
        <li data-i18n="politica_notebook_point1"></li>
        <li data-i18n="politica_notebook_point2"></li>
        <li data-i18n="politica_notebook_point3"></li>
      </ul>
      <p><strong data-i18n="impact_label"></strong> <span data-i18n="politica_notebook_impact"></span></p>
    </div>

    <!-- Correio Eletrônico e Internet -->
    <div class="card" onclick="toggleExpand('politica-email-internet')">
      <h3>📧 <span data-i18n="politica_email_title"></span></h3>
      <p data-i18n="politica_email_desc"></p>
    </div>
    <div id="politica-email-internet" class="expand">
      <h4 data-i18n="politica_email_what"></h4>
      <p data-i18n="politica_email_what_text"></p>
      <h4 data-i18n="politica_email_why"></h4>
      <ul>
        <li data-i18n="politica_email_point1"></li>
        <li data-i18n="politica_email_point2"></li>
        <li data-i18n="politica_email_point3"></li>
      </ul>
      <p><strong data-i18n="impact_label"></strong> <span data-i18n="politica_email_impact"></span></p>
    </div>

    <!-- Privacidade de Dados -->
    <div class="card" onclick="toggleExpand('politica-privacidade')">
      <h3>🔒 <span data-i18n="politica_privacidade_title"></span></h3>
      <p data-i18n="politica_privacidade_desc"></p>
    </div>
    <div id="politica-privacidade" class="expand">
      <h4 data-i18n="politica_privacidade_what"></h4>
      <p data-i18n="politica_privacidade_what_text"></p>
      <h4 data-i18n="politica_privacidade_why"></h4>
      <ul>
        <li data-i18n="politica_privacidade_point1"></li>
        <li data-i18n="politica_privacidade_point2"></li>
        <li data-i18n="politica_privacidade_point3"></li>
      </ul>
      <p><strong data-i18n="impact_label"></strong> <span data-i18n="politica_privacidade_impact"></span></p>
    </div>
  </div>
</section>

  <!-- QUIZ -->
<section id="quiz" class="quiz-section locked">
  <h2 data-i18n="quiz_title"></h2>
  <p class="quiz-warning" data-i18n="quiz_warning"></p>
  <button id="startQuiz" class="quiz-btn" disabled data-i18n="quiz_button"></button>
  <div id="quizBox" class="quiz-box hidden">
    <div id="question" data-i18n="quiz_question"></div>
    <div id="options"></div>
    <button id="nextBtn" class="next-btn" data-i18n="quiz_next"></button>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <h2 data-i18n="footer_title"></h2>
  <p data-i18n="footer_text"></p>
</footer>

<!-- JS -->
<script src="js/script.js"></script>
</body>
</html>
